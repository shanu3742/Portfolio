<style>
  .error-alert .alert-wrapper {
  background: rgba(30, 0, 0, 0.75); /* semi-transparent dark red */
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 80, 80, 0.4);
  box-shadow: 0 0 20px rgba(255, 60, 60, 0.35);
}

.error-alert .alert-title {
  color: #ff6b6b;
  font-weight: 600;
}

.error-alert .alert-message {
  color: #ffdede;
  font-size: 14px;
}

.error-alert .alert-button-group {
  display: none; /* no buttons */
}

.error-alert .alert-wrapper {
  animation: shake 0.35s ease;
}

@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  50% { transform: translateX(6px); }
  75% { transform: translateX(-4px); }
  100% { transform: translateX(0); }
}
</style>
